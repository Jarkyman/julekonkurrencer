name: julekonkurrencer
description: "Jule konkurrencer"

publish_to: 'none' 
version: 1.1.0+2

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  firebase_core: ^5.1.0
  firebase_analytics: ^13.0.1
  uuid: ^4.6.0
  flutter_device_apps: ^1.1.0
  flutter_local_notifications: ^23.0.0
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  http: ^1.6.0
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8


flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/branding.png
    - assets/predefined_calendars.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#0F4D3F"
  image: assets/icon.png
  branding: assets/branding.png
  branding_mode: bottom
  android_12:
    color: "#0F4D3F"
    image: assets/jule_icon_android12.png
    branding: assets/branding.png
  android: true
  ios: true
