name: julekonkurrencer
description: "Jule konkurrencer"

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
  firebase_core: ^4.2.1
  firebase_analytics: ^12.0.4
  uuid: ^4.5.2
  flutter_device_apps: 0.3.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  http: ^1.6.0
  permission_handler: ^12.0.1
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7


flutter:
  uses-material-design: true

  assets:
    - assets/icon.png
    - assets/branding.png
    - assets/predefined_calendars.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F4D3F"
  image: assets/icon.png
  branding: assets/branding.png
  branding_mode: bottom
  android_12:
    color: "#0F4D3F"
    image: assets/jule_icon_android12.png
    branding: assets/branding.png
  android: true
  ios: true
